<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>body { margin: 0; background: #07090e; overflow: hidden; }</style>
</head>
<body>
  <div id="log" style="color:red; font-family:monospace; position:absolute; z-index:999;"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.9, 3.2);
    camera.lookAt(0, 0.85, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Environment map for reflections
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load('/assets/nasa/nasa_iss_cupola_earth.jpg', (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = tex;
    });

    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x112233, 1.5);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 3.2);
    sun.position.set(2.5, 4.0, 3.0);
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x00d2ff, 1.8);
    rim.position.set(-2.5, 2.0, -2.0);
    scene.add(rim);

    const loader = new GLTFLoader();
    loader.load(
      '/models/Astronaut_Google.glb',
      (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const scale = 1.68 / (size.y || 1);
        root.scale.setScalar(scale);

        box.setFromObject(root);
        root.position.x = -(box.min.x + box.max.x) / 2;
        root.position.z = -(box.min.z + box.max.z) / 2;
        root.position.y = -box.min.y;

        root.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (m.isMeshStandardMaterial) {
                m.envMapIntensity = 2.2;
              }
            });
          }
        });

        scene.add(root);
        renderer.render(scene, camera);
        window.__RENDER_DONE = true;
      },
      undefined,
      (err) => {
        document.getElementById('log').innerText = 'ERROR: ' + err.message;
      }
    );
  </script>
</body>
</html>
